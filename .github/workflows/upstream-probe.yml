name: Upstream Probe

# Weekly automated probe that pulls LoopKit's latest RELEASED Loop into
# PowerPack's feat/AllFeatures branch. Conflict-free merges are pushed
# automatically; conflicts open an issue flagging that manual resolution
# is needed. After a conflict-free merge, dev is fast-forwarded to the
# merged release commit so Option B's diff base (dev) matches
# feat/AllFeatures.
#
# Release = the Loop commit pinned by LoopKit/LoopWorkspace:main. Not
# LoopKit/Loop:dev (contains unreleased work) and not LoopKit/Loop:main
# (unmaintained; last updated 2025-04). Taylor, 2026-10-12 and 2026-11-18.
#
# See DIVERGENCE.md "Upstream-merge cadence" for the published policy.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  discussions: write

jobs:
  probe-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feat/AllFeatures
        uses: actions/checkout@v4
        with:
          ref: feat/AllFeatures
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git author
        run: |
          git config user.name "powerpack-upstream-bot"
          git config user.email "actions@github.com"

      - name: Fetch LoopKit's released Loop commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_SHA=$(gh api 'repos/LoopKit/LoopWorkspace/contents/Loop?ref=main' --jq .sha)
          if [ -z "$RELEASE_SHA" ]; then
            echo "::error::Could not read the Loop submodule pin from LoopKit/LoopWorkspace main."
            exit 1
          fi
          git remote add upstream https://github.com/LoopKit/Loop.git
          git fetch upstream "$RELEASE_SHA"
          git update-ref refs/remotes/upstream/release "$RELEASE_SHA"

      - name: Capture upstream release info
        id: upstream
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/release)
          UPSTREAM_SHORT=${UPSTREAM_SHA:0:7}
          UPSTREAM_SUBJECT=$(git log -1 --pretty=%s upstream/release)
          echo "sha=$UPSTREAM_SHA"               >> $GITHUB_OUTPUT
          echo "short=$UPSTREAM_SHORT"           >> $GITHUB_OUTPUT
          echo "subject<<EOF"                    >> $GITHUB_OUTPUT
          echo "$UPSTREAM_SUBJECT"               >> $GITHUB_OUTPUT
          echo "EOF"                             >> $GITHUB_OUTPUT

      - name: Skip if already merged
        id: ahead_check
        run: |
          if git merge-base --is-ancestor upstream/release HEAD; then
            echo "already_merged=true" >> $GITHUB_OUTPUT
            echo "LoopKit's released Loop is already an ancestor of feat/AllFeatures — nothing to do."
          else
            echo "already_merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        if: steps.ahead_check.outputs.already_merged == 'false'
        id: merge
        continue-on-error: true
        run: |
          set +e
          git merge --no-edit --no-ff upstream/release \
            -m "Merge LoopKit released Loop ${{ steps.upstream.outputs.short }} into feat/AllFeatures"
          MERGE_RC=$?
          set -e
          if [ $MERGE_RC -ne 0 ]; then
            echo "conflicts=true" >> $GITHUB_OUTPUT
            git merge --abort || true
            exit 0
          fi
          echo "conflicts=false" >> $GITHUB_OUTPUT

      - name: Push merge commit
        if: steps.ahead_check.outputs.already_merged == 'false' && steps.merge.outputs.conflicts == 'false'
        run: git push origin feat/AllFeatures

      # install_features.sh (Option B) builds its patches as
      # `git diff dev..feat/AllFeatures`. If dev stays behind the upstream
      # commit merged above, Option B re-applies upstream code to users who
      # already have it (2026-11-18: duplicate applyFullBleedBackground() and
      # conflict markers in StatusTableViewController). Runs after the push,
      # never before, and only as a fast-forward.
      - name: Fast-forward dev to merged release commit
        if: steps.merge.outputs.conflicts != 'true'
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor upstream/release origin/dev; then
            echo "dev already contains the release commit — nothing to do."
          elif git merge-base --is-ancestor origin/dev upstream/release \
               && git merge-base --is-ancestor upstream/release HEAD; then
            git push origin upstream/release:refs/heads/dev
          else
            echo "::warning::dev is not an ancestor of the release commit; not moved. Fix dev by hand."
          fi

      - name: Open conflict issue
        if: steps.ahead_check.outputs.already_merged == 'false' && steps.merge.outputs.conflicts == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = "${{ steps.upstream.outputs.sha }}";
            const short = "${{ steps.upstream.outputs.short }}";
            const subject = `${{ steps.upstream.outputs.subject }}`;
            const title = `Upstream merge conflict — LoopKit/Loop@${short}`;
            const body = [
              `Automated weekly upstream probe hit conflicts when merging LoopKit's released Loop (the commit pinned by \`LoopKit/LoopWorkspace:main\`) into \`feat/AllFeatures\`.`,
              ``,
              `**Upstream commit:** [${sha}](https://github.com/LoopKit/Loop/commit/${sha})`,
              `**Subject:** ${subject}`,
              `**Triggered by:** \`upstream-probe.yml\` (Mondays 06:00 UTC)`,
              ``,
              `**Resolve manually:**`,
              `\`\`\`bash`,
              `git checkout feat/AllFeatures`,
              `git fetch upstream ${sha}`,
              `git merge ${sha}`,
              `# resolve conflicts`,
              `git push origin feat/AllFeatures`,
              `git push origin ${sha}:refs/heads/dev   # after feat/AllFeatures, fast-forward only`,
              `\`\`\``,
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['upstream-merge-conflict']
              });
              core.notice(`Opened issue: ${title}`);
            } catch (err) {
              if (err.status === 410 || err.status === 404) {
                core.warning(`Issues disabled on ${owner}/${repo} — falling back to workflow summary.`);
                await core.summary
                  .addHeading(title, 2)
                  .addRaw(body)
                  .write();
              } else {
                throw err;
              }
            }
